{% extends "base.html" %}

{% block content %}
  <h1>Car: {{ car.model }}</h1>
  <p>Manufacturer: {{ car.manufacturer.name }}</p>

  <p>Drivers:</p>
  <ul>
    {% for d in car.drivers.all %}
      <li>{{ d.username }}</li>
    {% empty %}
      <li>No drivers assigned</li>
    {% endfor %}
  </ul>
{% endblock %}
